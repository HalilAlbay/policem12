name: Push notification isolated tests
on:
  push:
    branches:
      - feature/notifications-foundation
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_notification_core test_push_service
      - run: python -m compileall -q notification_core.py push_service.py push_job.py app.py
