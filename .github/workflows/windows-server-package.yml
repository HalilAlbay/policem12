name: Windows Server package
on:
  workflow_dispatch:
  push:
    branches: [feature/windows-server-installer-v1]
    paths:
      - 'packaging/**'
      - '.github/workflows/windows-server-package.yml'
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"
      - name: Package executable
        run: python -m PyInstaller --noconfirm packaging/PolicemServer.spec
      - name: Verify output
        shell: pwsh
        run: ./packaging/verify-build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PolicemServer-windows-2022-unsigned
          path: dist/PolicemServer/
          retention-days: 7
