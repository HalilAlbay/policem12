name: Poliçem iOS TestFlight release
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Unique increasing TestFlight build number"
        required: true
        type: string
jobs:
  testflight:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      APP_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      PROFILE_NAME: ${{ vars.IOS_PROFILE_NAME }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Check required signing configuration
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          for item in APP_BUNDLE_ID APPLE_TEAM_ID PROFILE_NAME ASC_KEY_ID ASC_ISSUER_ID CERT CERT_PASSWORD PROFILE ASC_KEY; do
            if [ -z "${!item}" ]; then echo "::error::Missing configuration: $item"; exit 1; fi
          done
      - name: Generate iOS runner and install Flutter dependencies
        run: |
          cd flutter_app
          flutter create --platforms=ios --project-name policem_flutter .
          flutter pub get
      - name: Configure Face ID permission and app bundle identifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          plist=Path('flutter_app/ios/Runner/Info.plist')
          data=plist.read_text()
          if 'NSFaceIDUsageDescription' not in data:
              data=data.replace('</dict>', '  <key>NSFaceIDUsageDescription</key>\n  <string>Poliçem oturumunu Face ID ile açmak için kullanılır.</string>\n</dict>', 1)
          plist.write_text(data)
          project=Path('flutter_app/ios/Runner.xcodeproj/project.pbxproj')
          data=project.read_text()
          data=data.replace('com.example.policemFlutter', os.environ['APP_BUNDLE_ID'])
          data=data.replace('com.example.policem_flutter', os.environ['APP_BUNDLE_ID'])
          project.write_text(data)
          PY
      - name: Install distribution certificate and provisioning profile
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/policem-signing.keychain-db"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/policem.mobileprovision"
      - name: Prepare Flutter release
        run: |
          cd flutter_app
          flutter build ios --release --no-codesign --build-number="${{ inputs.build_number }}"
      - name: Archive signed iOS app
        run: |
          cd flutter_app/ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Policem.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive
      - name: Export App Store IPA
        run: |
          python3 - <<'PY'
          import os, plistlib
          data={'method':'app-store-connect','destination':'export','signingStyle':'manual',
                'teamID':os.environ['APPLE_TEAM_ID'],
                'provisioningProfiles':{os.environ['APP_BUNDLE_ID']:os.environ['PROFILE_NAME']}}
          with open(os.environ['RUNNER_TEMP']+'/ExportOptions.plist','wb') as f: plistlib.dump(data,f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Policem.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload signed IPA to TestFlight
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove local signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
